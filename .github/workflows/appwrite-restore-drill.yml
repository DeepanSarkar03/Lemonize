name: Appwrite staging restore drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESTORE_STAGING_TO_ISOLATED_DATABASE
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: appwrite-staging-mutation
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Restore synthetic staging database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
    steps:
      - name: Require an immutable protected main revision
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$SOURCE_REF" != refs/heads/main ]]; then
            echo "Restore drills must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "GitHub did not provide an immutable commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable checkout and required CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA,,}"
          required_checks=(
            'Frozen install, lint, typecheck, build, test'
            'Audit production dependencies (high/critical)'
            'Audit development dependencies (high/critical)'
            'Secret scan (full history)'
            'Worker dry-run and web build'
            'Artifact integrity, extraction, and CLI security tests'
          )
          for check_name in "${required_checks[@]}"; do
            latest_conclusion=$(gh api \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs?per_page=100&filter=latest" \
              --jq "[.check_runs[] | select(.name == \"$check_name\")] | sort_by(.id) | last | .conclusion // \"\"")
            test "$latest_conclusion" = success || {
              echo "Required CI check has not passed for $SOURCE_SHA: $check_name" >&2
              exit 1
            }
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install pinned Appwrite CLI
        run: >-
          npm install --global --ignore-scripts --no-audit --no-fund
          appwrite-cli@22.6.1
      - name: Validate staging linkage and read-only gate
        env:
          DEPLOY_ENV: staging
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          REGISTRY_MODE: ${{ vars.REGISTRY_MODE }}
          ALLOW_PUBLIC_PUBLISH: ${{ vars.ALLOW_PUBLIC_PUBLISH }}
        run: |
          bash scripts/ops/require-env.sh \
            APPWRITE_ENDPOINT APPWRITE_PROJECT_ID REGISTRY_MODE ALLOW_PUBLIC_PUBLISH
          node scripts/ops/verify-appwrite-config.mjs staging
          test "$REGISTRY_MODE" = read_only
          test "$ALLOW_PUBLIC_PUBLISH" = false
      - name: Restore and verify isolated synthetic database
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_BACKUP_API_KEY: ${{ secrets.APPWRITE_BACKUP_API_KEY }}
          APPWRITE_DEPLOY_API_KEY: ${{ secrets.APPWRITE_DEPLOY_API_KEY }}
          REGISTRY_MODE: ${{ vars.REGISTRY_MODE }}
          ALLOW_PUBLIC_PUBLISH: ${{ vars.ALLOW_PUBLIC_PUBLISH }}
          RESTORE_DRILL_CONFIRMATION: ${{ inputs.confirmation }}
          RESTORE_DRILL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          APPWRITE_CLI_HOME: ${{ runner.temp }}/appwrite-cli
        run: bash scripts/ops/appwrite-restore-drill.sh
      - name: Confirm staging runtime remained healthy and read-only
        env:
          REGISTRY_BASE_URL: ${{ vars.REGISTRY_BASE_URL }}
        run: |
          ready=$(curl --fail --silent --show-error --retry 4 --retry-all-errors \
            "$REGISTRY_BASE_URL/ready")
          limits=$(curl --fail --silent --show-error --retry 4 --retry-all-errors \
            "$REGISTRY_BASE_URL/v1/limits")
          node -e '
            const ready = JSON.parse(process.argv[1]);
            const limits = JSON.parse(process.argv[2]);
            if (ready.status !== "ready" || ready.dependencies?.appwrite !== "ok" ||
                limits.publishRestricted !== true || limits.openSignup !== false) process.exit(1);
          ' "$ready" "$limits"
